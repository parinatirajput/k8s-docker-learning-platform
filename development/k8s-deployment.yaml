apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-learning-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-learning-webapp
  template:
    metadata:
      labels:
        app: k8s-learning-webapp
    spec:
      serviceAccountName: webapp-sa
      containers:
      - name: webapp
        image: <ECR_OR_DOCKER_IMAGE_URI>:latest
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
      # If you want docker socket (risk!), mount it here (NOT recommended in production)
      # volumes:
      # - name: dockersock
      #   hostPath:
      #     path: /var/run/docker.sock
      #     type: Socket
      # volumeMounts:
      # - name: dockersock
      #   mountPath: /var/run/docker.sock
