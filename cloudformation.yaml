AWSTemplateFormatVersion: '2010-09-09'
Description: Deploy Flask Docker App on EC2

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName

  DockerImage:
    Type: String

Resources:

  FlaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH & Flask
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0

  FlaskInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      ImageId: ami-0e2c8caa4b6378d8c  # Ubuntu 22.04 (update if needed)
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !Ref FlaskSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt update -y
          apt install -y docker.io
          systemctl start docker
          systemctl enable docker

          docker pull ${DockerImage}

          docker stop flask-app || true
          docker rm flask-app || true

          docker run -d --name flask-app -p 5000:5000 ${DockerImage}

Outputs:
  PublicIP:
    Value: !GetAtt FlaskInstance.PublicIp

